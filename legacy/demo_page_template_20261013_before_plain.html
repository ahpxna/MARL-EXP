<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When AIs Meet AIs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Three views (tabs), each a side-by-side comparison of two recorded simulations, its own result cards and its own chart.
   Single dark look on purpose: night asphalt reads best on a projector. */
:root {
  --bg: #0f1214; --panel: #161a1d; --road: #262b30; --road-edge: #353b41; --fg: #e9ede9; --muted: #98a2a7;
  --ai: #3fd3c9; --human: #d8d2c4; --stop: #ff5b4f; --go: #5fdb6c; --amber: #ffb547; --line: #2b3136; --grid: #262c31;
  --display: "Overpass", "Highway Gothic", "Arial Narrow", system-ui, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--display); padding-block: 18px 28px; padding-inline: max(16px, 3vw); margin: 0; }
.wrap { max-width: 1280px; margin-inline: auto; display: grid; gap: 16px; }
header { display: grid; gap: 8px; }
h1 { font-weight: 800; font-size: clamp(28px, 4vw, 50px); letter-spacing: 0.01em; margin: 0; line-height: 1.02; text-wrap: balance; }
h1 .g { color: var(--go); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { font-size: 15px; }
.tabs button .n { color: var(--muted); font-weight: 400; margin-left: 6px; }
.tabs button.on .n { color: var(--ai); }
.sub { color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); max-width: 78ch; margin: 0; }
.pickrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pickrow label { color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.ptop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; }
.tag { font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 9px; border-radius: 4px; white-space: nowrap; }
.tag.base { background: #3a2a1d; color: #ffc98f; }
.tag.ai { background: #12312f; color: var(--ai); }
.ptitle { font-weight: 600; font-size: 16px; margin: 0; }
canvas.map { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 6px; background: #0b0d0f; max-width: 100%; }
.live { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kv { display: grid; gap: 2px; align-content: start; }
.kv .k { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.kv .v { font-family: var(--mono); font-size: clamp(17px, 2vw, 25px); font-weight: 600; font-variant-numeric: tabular-nums; }
.kv .v.bad { color: var(--stop); } .kv .v.good { color: var(--go); }
.caption { color: var(--muted); font-size: 14px; margin: 0; min-height: 3em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
button, select { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--fg); background: #20262b; border: 1px solid #39424a; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
button.on { background: #12312f; border-color: var(--ai); color: var(--ai); }
select:disabled { opacity: 0.6; cursor: default; }
#scrub { flex: 1 1 160px; accent-color: var(--ai); min-width: 0; }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 9ch; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 12px; height: 6px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .results { grid-template-columns: 1fr; } }
.res { border-top: 3px solid var(--go); padding-top: 10px; display: grid; gap: 4px; align-content: start; }
.res.warn { border-top-color: var(--amber); }
.res .big { font-family: var(--mono); font-weight: 600; font-size: clamp(34px, 5vw, 60px); line-height: 1; color: var(--go); font-variant-numeric: tabular-nums; }
.res.warn .big { color: var(--amber); }
.res .big.long { font-size: clamp(26px, 3.3vw, 42px); white-space: nowrap; }
.res .what { font-weight: 600; font-size: 17px; }
.res .from { color: var(--muted); font-family: var(--mono); font-size: 13px; }
.chartbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.chartbox h2 { font-size: 16px; font-weight: 600; margin: 0; }
.chartbox .note { color: var(--muted); font-size: 13px; margin: 0; }
#chart { width: 100%; display: block; }
#chart text { font-family: var(--display); }
.foot { color: var(--muted); font-size: 12px; max-width: 120ch; margin: 0; }
.trainwin { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(220px, 34vw); background: var(--panel);
  border: 1px solid #39424a; border-radius: 10px; padding: 8px; display: grid; gap: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); z-index: 5; }
.trainwin[hidden] { display: none; }
.trainwin .tw-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.trainwin .tw-tag { font-weight: 800; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.trainwin .tw-x { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.trainwin .tw-ep { font-weight: 600; font-size: 12px; min-height: 2.4em; }
.trainwin button { font-size: 12px; padding: 2px 8px; }
#cT { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 6px; }
#curve { width: 100%; height: 42px; display: block; }
@media (max-width: 760px) { .trainwin { position: static; width: 100%; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1>When AIs <span class="g">meet AIs</span></h1>
    <div class="tabs" role="tablist" aria-label="Choose the view" id="tabs"></div>
    <p class="sub" id="sub"></p>
    <div class="pickrow"><label for="pick">Compare</label><select id="pick" aria-label="Choose the comparison"></select></div>
  </header>

  <section class="stage" aria-label="Two simulations side by side">
    <div class="panel">
      <div class="ptop"><span class="tag" id="tagL"></span><p class="ptitle" id="titleL"></p></div>
      <canvas class="map" id="cL" aria-label="Left simulation"></canvas>
      <div class="live">
        <div class="kv"><span class="k hk">Cars stopped now</span><span class="v" id="hL">0</span></div>
        <div class="kv"><span class="k">Average speed</span><span class="v" id="sL">0</span></div>
        <div class="kv"><span class="k" id="wLk">Time stopped so far</span><span class="v" id="wL">0</span></div>
        <div class="kv"><span class="k" id="dLk">Delay per trip, whole run</span><span class="v" id="dL">0</span></div>
      </div>
      <p class="caption" id="capL"></p>
    </div>
    <div class="panel">
      <div class="ptop"><span class="tag" id="tagR"></span><p class="ptitle" id="titleR"></p></div>
      <canvas class="map" id="cR" aria-label="Right simulation"></canvas>
      <div class="live">
        <div class="kv"><span class="k hk">Cars stopped now</span><span class="v" id="hR">0</span></div>
        <div class="kv"><span class="k">Average speed</span><span class="v" id="sR">0</span></div>
        <div class="kv"><span class="k" id="wRk">Time stopped so far</span><span class="v" id="wR">0</span></div>
        <div class="kv"><span class="k" id="dRk">Delay per trip, whole run</span><span class="v" id="dR">0</span></div>
      </div>
      <p class="caption" id="capR"></p>
    </div>
  </section>

  <div class="controls">
    <button id="play" class="on" aria-label="Play or pause">Pause</button>
    <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4" class="on">4×</button><button data-speed="8">8×</button>
    <button id="zoom" aria-pressed="false">Zoom in</button>
    <input id="scrub" type="range" min="0" max="299" step="0.01" value="0" aria-label="Simulation time">
    <span class="clock" id="clock">25:00</span>
    <div class="legend" id="legend"></div>
    <button id="twbtn" aria-pressed="false">How they learned</button>
  </div>

  <section class="results" id="results" aria-label="Results over the full experiment"></section>
  <section class="chartbox" aria-label="Chart"><h2 id="chartTitle"></h2><svg id="chart" role="img"></svg><p class="note" id="chartNote"></p></section>
  <p class="foot" id="foot"></p>
</div>

<aside class="trainwin" aria-label="Training replay" hidden>
  <div class="tw-top"><span class="tw-tag">Learning · 4×4 grid</span><span class="tw-x">20× <button id="twclose" aria-label="Close training replay">×</button></span></div>
  <canvas id="cT" aria-label="The agents while they were learning"></canvas>
  <div class="tw-ep" id="twEp"></div>
  <canvas id="curve" aria-label="Learning curve"></canvas>
</aside>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const VIEWS = D.views, ORDER = D.order, NETS = D.nets, SCENES = D.scenes;
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const COL = { road: C('--road'), edge: C('--road-edge'), ai: C('--ai'), human: C('--human'), stop: C('--stop'), go: C('--go'), amber: C('--amber'), muted: C('--muted'), grid: C('--grid'), fg: C('--fg') };
  const pad = 20, el = id => document.getElementById(id);
  function prep(scene) {                        // id -> entry per frame, for interpolation; ch / ca = car-seconds stopped before this frame (all cars / AI cars)
    const dt = scene.dt || 1; let ch = 0, ca = 0;
    return scene.frames.map(f => { const m = new Map(); let a = 0; for (const v of f.v) { m.set(v[0], v); if (v[4] < 1 && v[5] === 1) a++; }
      const e = { f, m, a, ch, ca }; ch += f.h * dt; ca += a * dt; return e; });
  }
  function stoppedSoFar(key, ai) {              // live: car-seconds stopped since the clip started, interpolated inside the frame
    const sc = SCENES[key], pr = P(key), dt = sc.dt || 1, x = Math.max(0, t / dt), i = Math.min(Math.floor(x), pr.length - 1), e = pr[i], a = Math.min(1, x - i);
    return ai ? e.ca + e.a * dt * a : e.ch + e.f.h * dt * a;
  }
  const carMin = s => { const m = s / 60; return (m < 100 ? m.toFixed(1) : Math.round(m).toLocaleString('en-US')) + ' car-min'; };
  const PREP = {}; const P = k => (PREP[k] = PREP[k] || prep(SCENES[k]));
  // one canvas showing one box of one net; the static road layer is drawn once into an offscreen canvas
  function setup(canvas, net, box) {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, w = Math.max(160, r.width);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * dpr);
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const [bx0, by0, bx1, by1] = box, s = (w - 2 * pad) / Math.max(bx1 - bx0, by1 - by0);
    const ox = (w - 2 * pad - (bx1 - bx0) * s) / 2, oy = (w - 2 * pad - (by1 - by0) * s) / 2;
    const V = { ctx, w, s, net, X: x => pad + ox + (x - bx0) * s, Y: y => w - pad - oy - (y - by0) * s };
    const bg = document.createElement('canvas'); bg.width = canvas.width; bg.height = canvas.height;
    const g = bg.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#0b0d0f'; g.fillRect(0, 0, w, w); g.lineCap = 'round';
    const lanes = (col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
      for (const ln of net.lanes) ln.forEach((p, i) => i ? g.lineTo(V.X(p[0]), V.Y(p[1])) : g.moveTo(V.X(p[0]), V.Y(p[1]))); g.stroke(); };
    lanes(COL.edge, Math.max(2, 3.6 * s)); lanes(COL.road, Math.max(1.5, 3.0 * s));
    g.fillStyle = COL.road; for (const j of net.junctions) { const rr = Math.max(1.5, 12 * s); g.fillRect(V.X(j[0]) - rr, V.Y(j[1]) - rr, 2 * rr, 2 * rr); }
    V.bg = bg; return V;
  }
  function drawNet(V) { V.ctx.drawImage(V.bg, 0, 0, V.w, V.w); }
  function drawSignals(V, frame, tlsIds) {
    const { ctx, X, Y, s, net } = V, hl = Math.max(1.5, 2.2 / s);
    ctx.lineWidth = Math.max(2, 2.2 * s);
    tlsIds.forEach((tid, i) => {
      const st = frame.s[i]; const links = net.tls[tid]; if (!links || !st) return;
      for (const [idx, x1, y1, x0, y0] of links) {
        const c = st[idx]; ctx.strokeStyle = (c === 'G' || c === 'g') ? COL.go : (c === 'y' || c === 'Y') ? COL.amber : COL.stop;
        const dx = x1 - x0, dy = y1 - y0, n = Math.hypot(dx, dy) || 1, ux = dx / n, uy = dy / n;
        ctx.beginPath(); ctx.moveTo(X(x1 - uy * hl), Y(y1 + ux * hl)); ctx.lineTo(X(x1 + uy * hl), Y(y1 - ux * hl)); ctx.stroke();
      }
    });
  }
  // allHuman: every car in this run is driven by SUMO's human model (the fleet is released), so none is drawn as AI
  function drawCars(V, scene, allHuman, t, q = 10) {
    const { ctx, X, Y, s } = V, i = Math.max(0, Math.min(Math.floor(t), scene.length - 1)), a = Math.max(0, t - i);
    const cur = scene[i], nxt = scene[Math.min(i + 1, scene.length - 1)];
    const len = Math.max(4, 5 * s), wid = Math.max(2.2, 2.2 * s); let aiStop = 0;
    for (const v of cur.f.v) {
      const n = nxt.m.get(v[0]); let x = v[1] / q, y = v[2] / q;
      if (n && a > 0) { x += (n[1] / q - x) * a; y += (n[2] / q - y) * a; }
      const stopped = v[4] < 1, ai = !allHuman && v[5] === 1; if (ai && stopped) aiStop++;
      ctx.fillStyle = stopped ? COL.stop : ai ? COL.ai : COL.human;
      ctx.save(); ctx.translate(X(x), Y(y)); ctx.rotate(v[3] * Math.PI / 180);
      ctx.fillRect(-wid / 2, -len / 2, wid, len); ctx.restore();
    }
    return { f: cur.f, aiStop };
  }
  let view = ORDER[0], cmp = null, t = 0, speed = 4, playing = true, zoomed = false, last = performance.now(), L, R;
  const V_ = () => VIEWS[view], C_ = () => VIEWS[view].cmps[cmp];
  const span = key => (SCENES[key].frames.length - 1) * (SCENES[key].dt || 1);   // clip length in seconds
  function frameOf(V, key) { drawNet(V); const sc = SCENES[key], r = drawCars(V, P(key), !!sc.allHuman, t / (sc.dt || 1), sc.posScale || 10); drawSignals(V, r.f, sc.tls); return r; }
  function render() {
    const c = C_(), rl = frameOf(L, c.left), rr = frameOf(R, c.right), ai = !!V_().metricAI;
    const hl = ai ? rl.aiStop : rl.f.h, hr = ai ? rr.aiStop : rr.f.h;
    el('hL').textContent = hl; el('sL').textContent = Math.round(rl.f.ms * 3.6) + ' km/h';
    el('hR').textContent = hr; el('sR').textContent = Math.round(rr.f.ms * 3.6) + ' km/h';
    el('hR').className = 'v ' + (hr < hl ? 'good' : hr > hl ? 'bad' : ''); el('hL').className = 'v ' + (hl > hr ? 'bad' : '');
    const cl = stoppedSoFar(c.left, ai), cr = stoppedSoFar(c.right, ai); el('wL').textContent = carMin(cl); el('wR').textContent = carMin(cr);
    el('wR').className = 'v ' + (cr < cl ? 'good' : cr > cl ? 'bad' : ''); el('wL').className = 'v ' + (cl > cr ? 'bad' : '');
    const sec = SCENES[c.left].t0 + Math.floor(t), mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, '0'); el('clock').textContent = `${mm}:${ss}`;
    el('scrub').value = t;
  }
  function panel(S, key) {
    const sc = SCENES[key];
    el('tag' + S).textContent = sc.tag; el('tag' + S).className = 'tag ' + sc.tagClass; el('title' + S).textContent = sc.title; el('cap' + S).textContent = sc.caption;
    el('d' + S + 'k').textContent = V_().metricAI ? 'AI-car delay per trip, whole run' : 'Delay per trip, whole run';
    el('w' + S + 'k').textContent = V_().metricAI ? 'AI cars: time stopped so far' : 'Time stopped so far (all cars)';
    el('d' + S).textContent = sc.delay.toFixed(1) + ' s';
  }
  function resize() { const b = zoomed ? V_().zoom : NETS[V_().net].bbox; L = setup(el('cL'), NETS[V_().net], b); R = setup(el('cR'), NETS[V_().net], b); }
  function setCmp(k) {
    cmp = k; const c = C_(); el('pick').value = k; panel('L', c.left); panel('R', c.right);
    const dl = SCENES[c.left].delay, dr = SCENES[c.right].delay; el('dR').className = 'v ' + (dr < dl ? 'good' : 'bad'); el('dL').className = 'v ' + (dl > dr ? 'bad' : '');
    el('results').innerHTML = c.cards.map(r => `<div class="res${r.warn ? ' warn' : ''}"><span class="big${r.big.length > 7 ? ' long' : ''}">${r.big}</span><span class="what">${r.what}</span><span class="from">${r.from}</span></div>`).join('');
    const ai = !(SCENES[c.left].allHuman && SCENES[c.right].allHuman);
    el('legend').innerHTML = (ai ? '<span><i class="dot" style="background:var(--ai)"></i>AI eco-driving car</span>' : '') +
      '<span><i class="dot" style="background:var(--human)"></i>Human-driven car</span><span><i class="dot" style="background:var(--stop)"></i>Stopped</span>';
    el('foot').textContent = c.foot; drawChart(); render();
  }
  function setView(k) {
    view = k; const v = V_();
    document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.view === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    el('sub').textContent = v.sub;
    document.querySelectorAll('.hk').forEach(x => x.textContent = v.metricAI ? 'AI cars stopped now' : 'Cars stopped now');
    el('pick').innerHTML = ''; for (const [id, c] of Object.entries(v.cmps)) { const o = document.createElement('option'); o.value = id; o.textContent = c.label; el('pick').appendChild(o); }
    el('pick').disabled = Object.keys(v.cmps).length < 2;
    const n = span(v.cmps[v.first].left); el('scrub').max = n; if (t > n) t = 0;
    resize(); setCmp(v.first);
  }
  // ---------------- chart (inline SVG), per view: per-day dots with the mean, or before -> after with the after-interval ----------------
  function drawChart() {
    const ch = V_().chart, svg = el('chart'), W = Math.max(320, svg.getBoundingClientRect().width || 900);
    el('chartTitle').textContent = ch.title; el('chartNote').textContent = ch.note;
    const rowH = 40, top = 34, left = Math.min(270, W * 0.38), right = 90, H = top + ch.rows.length * rowH + 30;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
    const vals = ch.rows.flatMap(r => [...(r.points || []), r.a, r.b, r.lo, r.hi, r.mean].filter(x => x !== undefined && x !== null));
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const padv = (hi - lo) * 0.04 || 1; lo -= padv; hi += padv;
    const X = v => left + (W - left - right) * (v - lo) / (hi - lo);
    let s = '';
    for (const tk of niceTicks(lo, hi, 6)) s += `<line x1="${X(tk)}" x2="${X(tk)}" y1="${top - 8}" y2="${H - 24}" stroke="${tk === 0 ? '#59636b' : COL.grid}" stroke-width="1"/>` +
      `<text x="${X(tk)}" y="${H - 8}" fill="${COL.muted}" font-size="11" text-anchor="middle">${Number.isInteger(tk) ? String(tk).replace('-', '−') : fmt(tk)}</text>`;
    s += `<text x="${W - 4}" y="${H - 8}" fill="${COL.muted}" font-size="11" text-anchor="end">${ch.unit}</text>`;
    ch.rows.forEach((r, i) => {
      const y = top + i * rowH + rowH / 2;
      s += `<text x="${left - 10}" y="${y + 4}" fill="${COL.fg}" font-size="13" text-anchor="end">${r.label}</text>`;
      if (ch.kind === 'dots') {
        const col = r.ai ? COL.ai : COL.amber;
        for (const p of r.points) s += `<circle cx="${X(p)}" cy="${y}" r="4.5" fill="${col}" fill-opacity="0.55"><title>${r.label}: ${fmt(p)} ${ch.unit}</title></circle>`;
        s += `<line x1="${X(r.mean)}" x2="${X(r.mean)}" y1="${y - 11}" y2="${y + 11}" stroke="${COL.fg}" stroke-width="2.5"><title>mean ${fmt(r.mean)}</title></line>` +
          `<text x="${X(r.mean)}" y="${y - 14}" fill="${COL.fg}" font-size="11" text-anchor="middle">mean ${fmt(r.mean)}</text>`;
      } else {                                    // before (a) -> after (b); after-interval [lo, hi]
        s += `<line x1="${X(r.a)}" x2="${X(r.b)}" y1="${y}" y2="${y}" stroke="#59636b" stroke-width="2"/>`;
        if (r.lo !== undefined) s += `<line x1="${X(r.lo)}" x2="${X(r.hi)}" y1="${y}" y2="${y}" stroke="${r.pass ? COL.go : COL.amber}" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>`;
        s += `<circle cx="${X(r.a)}" cy="${y}" r="6" fill="${COL.stop}"><title>without TSI-G: ${fmt(r.a)} ${ch.unit}</title></circle>` +
          `<circle cx="${X(r.b)}" cy="${y}" r="6" fill="${r.pass ? COL.go : COL.amber}"><title>with TSI-G: ${fmt(r.b)} ${ch.unit}</title></circle>` +
          `<text x="${X(Math.max(r.a, r.b, r.hi ?? -1e9)) + 10}" y="${y + 4}" fill="${COL.muted}" font-size="12">${fmt(r.a)} → ${fmt(r.b)}</text>`;
      }
    });
    svg.innerHTML = s;
  }
  function niceTicks(lo, hi, n) { const st = Math.pow(10, Math.floor(Math.log10((hi - lo) / n))); const m = [1, 2, 5, 10].find(k => (hi - lo) / (st * k) <= n) * st;
    const out = []; for (let v = Math.ceil(lo / m) * m; v <= hi + 1e-9; v += m) out.push(Math.round(v * 1000) / 1000); return out; }
  function fmt(v) { const a = Math.abs(v); const s = a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2); return s.replace('-', '−'); }
  for (const k of ORDER) {
    const b = document.createElement('button'); b.dataset.view = k; b.setAttribute('role', 'tab'); b.innerHTML = `${VIEWS[k].label}<span class="n">${VIEWS[k].count}</span>`;
    b.addEventListener('click', () => setView(k)); el('tabs').appendChild(b);
  }
  let loop = function (now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
    if (playing) { t += dt * speed; if (t >= span(C_().left)) t = 0; render(); }
    requestAnimationFrame(loop);
  };
  el('pick').addEventListener('change', e => setCmp(e.target.value));
  el('play').addEventListener('click', () => { playing = !playing; el('play').textContent = playing ? 'Pause' : 'Play'; el('play').classList.toggle('on', playing); });
  document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
    speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); }));
  el('zoom').addEventListener('click', () => { zoomed = !zoomed; el('zoom').textContent = zoomed ? 'Whole map' : 'Zoom in'; el('zoom').classList.toggle('on', zoomed); el('zoom').setAttribute('aria-pressed', zoomed); resize(); render(); });
  el('scrub').addEventListener('input', e => { t = +e.target.value; render(); });
  window.addEventListener('resize', () => { resize(); render(); drawChart(); });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { speed = 1; }
  // ---------------- training replay (corner window, 20x, the 4x4 grid where the agents trained); closed by default ----------------
  const TR = D.train || null; let tw = null, T;
  if (TR) {
    const seq = [];
    for (const e of TR.light.episodes) seq.push({ kind: 'light', ep: e.ep, n: TR.light.n, frames: prep({ frames: e.frames }), tls: TR.light.tls });
    for (const e of TR.fleet.episodes) seq.push({ kind: 'fleet', ep: e.ep, n: TR.fleet.n, frames: prep({ frames: e.frames }), tls: TR.fleet.tls });
    tw = { seq, i: 0, t: 0, open: false };
  } else { el('twbtn').hidden = true; }
  function toggleTW(open) { if (!tw) return; tw.open = open; document.querySelector('.trainwin').hidden = !open; el('twbtn').classList.toggle('on', open); el('twbtn').setAttribute('aria-pressed', open);
    if (open) { T = setup(el('cT'), NETS[TR.net], NETS[TR.net].bbox); drawCurve(tw.seq[tw.i]); } }
  el('twbtn').addEventListener('click', () => toggleTW(!(tw && tw.open))); el('twclose').addEventListener('click', () => toggleTW(false));
  function drawCurve(item) {
    const c = el('curve'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
    const ys = TR[item.kind].curve, n = ys.length, lo = Math.min(...ys), hi = Math.max(...ys), X = i => 4 + (r.width - 8) * i / (n - 1), Y = v => r.height - 6 - (r.height - 14) * (v - lo) / ((hi - lo) || 1);
    g.strokeStyle = '#3a434a'; g.lineWidth = 1; g.beginPath(); g.moveTo(4, r.height - 6); g.lineTo(r.width - 4, r.height - 6); g.stroke();
    g.strokeStyle = item.kind === 'light' ? COL.go : COL.ai; g.lineWidth = 1.5; g.beginPath(); ys.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
    g.fillStyle = COL.amber; g.beginPath(); g.arc(X(item.ep), Y(ys[item.ep]), 3.5, 0, 2 * Math.PI); g.fill();
    g.fillStyle = '#98a2a7'; g.font = '10px ' + css.getPropertyValue('--mono'); g.fillText(TR[item.kind].label, 6, 10);
  }
  function renderT(dt) {
    if (!tw || !tw.open) return; const item = tw.seq[tw.i]; tw.t += dt * 20;
    if (tw.t >= item.frames.length - 1) { tw.t = 0; tw.i = (tw.i + 1) % tw.seq.length; drawCurve(tw.seq[tw.i]); }
    const it = tw.seq[tw.i]; drawNet(T); const r = drawCars(T, it.frames, it.kind === 'light', tw.t); drawSignals(T, r.f, it.tls);
    el('twEp').textContent = (it.kind === 'light' ? 'AI lights learning' : 'AI cars learning') + ` · episode ${it.ep + 1} of ${it.n}` + (it.ep === 0 ? ' (random start)' : it.ep + 1 === it.n ? ' (final)' : '');
  }
  const _loop = loop;
  loop = function (now) { const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); renderT(playing ? dt : 0); _loop(now); };
  window.addEventListener('resize', () => { if (tw && tw.open) { T = setup(el('cT'), NETS[TR.net], NETS[TR.net].bbox); drawCurve(tw.seq[tw.i]); } });
  setView(view); requestAnimationFrame(loop);
})();
</script>
