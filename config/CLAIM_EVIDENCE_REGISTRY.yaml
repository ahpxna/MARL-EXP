schema: cig_amf_claim_evidence_v1
policy:
  source_metadata_location: config
  run_artifact_location: research
  research_is_generated_and_gitignored: true
  required_run_fields: [source_sha, protocol_sha, seed, artifact_sha, evidence_class]
claims:
  MASTER:
    required: [certificate_frontier, full_support_family_utility, learned_uncertainty]
  FUNCTIONAL:
    required: [v7_fresh_complete_grid, variance_stopping, matched_budget]
  REFERENCE:
    required: [kernel_control, response_reference_budget_split]
  STRUCTURAL:
    required: [approximate_defect, negative_taxonomy]
  D6:
    required: [exact_q_grid, m3_deep, m4_deep, m5_directed, witness_local_campaign]
  QUERY:
    required: [primitive_transfer_matrix, faithful_external_methods]

novelty_critical_planned:
  MASTER: [typed_certificate_completion]
  FUNCTIONAL: [selective_certificate_maintenance]
  SUPPORT: [decision_critical_joint_support_identification]
  STRUCTURAL: [prefix_cover_dimension_search]
  D6: [cost_aware_paec_completion, first_order_insufficiency_b7]
  QUERY: [semantic_identifiability_verifier]
policy_notes:
  novelty_critical_planned_is_not_current_required_evidence: true
  active_acquisition_is_not_standalone_novelty: true
  d6_cost_aware_completion_does_not_assume_EveryTopCPairHasPAEC: true
